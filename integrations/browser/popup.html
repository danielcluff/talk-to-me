<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Talk to Me</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <div class="title">Talk to Me</div>
      <div id="status" class="status">checking…</div>
    </div>
    <div class="badge">local</div>
  </header>

  <section id="connect" class="card" hidden>
    <div>This extension isn't connected to the Talk to Me app yet.</div>
    <div class="row-actions">
      <button id="connect-btn" class="primary">Connect</button>
      <span id="code" class="status"></span>
    </div>
  </section>

  <section class="actions">
    <button data-scope="page" class="row"><span>Read this tab</span></button>
    <button data-scope="pick" class="row"><span>Pick an element</span><kbd>click it</kbd></button>
    <div class="row hint"><span>Read a selection</span><kbd>⌥⇧R anywhere</kbd></div>
  </section>

  <section class="card">
    <label class="check"><input id="show-pill" type="checkbox"><span>Show the floating button on pages</span></label>
  </section>

  <footer>
    <span>Pause, skip and stop: the bar on the page, or the Talk to Me menu</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
